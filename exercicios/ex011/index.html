<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
</head>
<body>
    <h1> Imagens dinâmicas</h1>
    <p> Use o scroll do site para ver 3 imagens aparecendo dependendo da posição do scroll. Abra também em vários dispositivos para ver qual imagem vai aparecer</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
         <source media="(max-width: 1050px)" srcset="imagens/foto2-p.png" type="image/png">
         <source media="(max-width: 1500px)" srcset="imagens/foto3-p.png" type="image/png">
        <img src="imagens/foto-MEGA-p.png" alt="Imagem de teste">
    </picture>
    <h1> Áudio em sites!</h1>
    <p> Vamos agora aprender a utilizar áudio em nossos sites</p>
    <audio controls loop>
        <source src="guanacast-33.mp3" type="audio/mpeg">
        <source src="guanacast-33.ogg" type="audio/ogg">
        <p>Seu navegador não suporta o elemento de áudio.</p>

    
</body>
</html>
