<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags de HTML</title>
</head>
<body>
    <h1> Tags em HTML</h1>
    <p> Em HTML5, podemos inserir os elementos da lista a seguir.<br>Passe o mouse por cima deles para ver a tag</p>
    <ul>
        <li> <abbr title="Use a tag &lt;p&gt;">Parágrafos</abbr></li>
        <li> <abbr title="Use a tag &lt;img&gt; a &lt;h6&gt;">Imagens</abbr></li>
        <li> <abbr title="Use a tag &lt;h1&gt; para títulos principais">Títulos</abbr></li>
        <li> <abbr title="Use a tag &lt;abbr&gt; para abreviações">Abreviações</abbr></li>
        <li> <abbr title="Use a tag &lt;code&gt; para códigos ou larguras iguais">Códigos-fonte</abbr></li>
        <li> <abbr title="Use a tag &lt;ol&gt; e a tag &lt;li&gt; para listas numeradas">Listas numeradas</abbr></li>
        <li> <abbr title="Use a tag &lt;ul&gt; e a tag &lt;li&gt; para listas em demarcadores
            ">Listas em demarcadores</abbr></li>   
    </ul>
</body>
</html>
