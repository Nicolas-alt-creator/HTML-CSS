<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas no HTML</title>
    <style>
        h1 {
            display: inline-block;
            background-color: lightblue;
            padding: 10px;
            border: 2px solid blue;
            margin-right: 10px;
            margin-left: 10px;

        }

        h1#caixa1 {
            background-color: red;
            border-color: blue;
            height: 300px;
            width: 300px;
            margin: 20px;
            

        }
    </style>
</head>
<body>
    <h1>Caixas box-model e inline-block</h1>
    <p>Caixas box-model são aquelas que ocupa uma linha inteira, já os inline block ocupam apenas o espaço necessário.</p>
    <p>Exemplo está no próprio título</p>

    <h1 id="caixa1">Caixa 1, Lorem ipsum dolor sit amet consectetur, adipisicing elit. Odit ba doença, vai embora, junto com a sujeira</h1>
    
</body>
</html>
